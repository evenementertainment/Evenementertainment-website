<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evenementertainment</title><meta id="metaDesc" name="description" content=""><meta name="theme-color" content="#07070a"><style>
:root{
 --bg:#07070a;--panel:#101016;--panel2:#15151d;--text:#fafafa;--muted:#b2b2bd;
 --line:rgba(255,255,255,.11);--accent:#ff1f9a;--accent2:#7c3cff;--cyan:#28d7ff;
 --max:1180px;--radius:24px;--shadow:0 24px 80px rgba(0,0,0,.45)
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}.wrap{width:min(var(--max),92%);margin:auto}
header{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(7,7,10,.76);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.nav{height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.logo{height:48px;width:auto;max-width:210px;object-fit:contain}
.navlinks{display:flex;align-items:center;gap:25px;font-size:14px;font-weight:800}.navlinks a{color:#e7e7ec}.navlinks a:hover{color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:13px;padding:13px 19px;font-weight:900;border:1px solid var(--line);transition:.2s}
.btn:hover{transform:translateY(-2px)}.primary{border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 12px 35px rgba(255,31,154,.22)}
.ghost{background:rgba(255,255,255,.04)}.menu{display:none;border:0;background:none;color:#fff;font-size:27px}
.hero{min-height:94vh;position:relative;display:flex;align-items:flex-end;overflow:hidden;background:#07070a}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,4,7,.95) 0%,rgba(4,4,7,.67) 48%,rgba(4,4,7,.18) 100%),url("assets/hero.jpg") center/cover}
.hero:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,var(--bg))}
.hero .wrap{position:relative;z-index:2;padding:165px 0 105px}.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:950;color:#ff7fc5}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff2c9f;box-shadow:0 0 20px #ff2c9f;margin-right:8px}
h1{font-size:clamp(48px,7vw,90px);line-height:.94;letter-spacing:-.055em;margin:18px 0 20px;max-width:820px}
h1 span{background:linear-gradient(90deg,#fff,#ff7ac5,#8f7bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(18px,2vw,23px);color:#dedee6;max-width:690px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.stats{position:relative;z-index:5;margin-top:-38px}.statsgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:rgba(17,17,24,.93);border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:var(--shadow)}
.stat strong{display:block;font-size:17px}.stat small{display:block;color:var(--muted);margin-top:3px}
section{padding:100px 0}.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:35px;margin-bottom:34px}
h2{font-size:clamp(35px,5vw,58px);line-height:1.03;letter-spacing:-.045em;margin:8px 0}.sectionhead p{max-width:540px;color:var(--muted);margin:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.cardimg{height:235px;background:center/cover}.cardbody{padding:24px}.card h3{margin:0 0 7px;font-size:24px}.card p{margin:0 0 18px;color:var(--muted)}.more{font-weight:900;color:#ff8dca}
.dark{background:radial-gradient(circle at 80% 20%,rgba(124,60,255,.18),transparent 30%),#0a0a0f}
.two{display:grid;grid-template-columns:1fr 1fr;gap:55px;align-items:center}.visual{min-height:560px;border-radius:28px;background:center/cover;box-shadow:var(--shadow);border:1px solid var(--line)}
.list{display:grid;gap:12px;margin:25px 0}.list div{display:flex;gap:12px;align-items:flex-start}.tick{color:#ff55ad;font-weight:1000}
.gallery{display:grid;grid-template-columns:1.2fr .8fr .8fr;grid-auto-rows:220px;gap:12px}.gallery img{width:100%;height:100%;object-fit:cover;border-radius:18px;border:1px solid var(--line)}.gallery img:first-child{grid-row:span 2}
.press{background:linear-gradient(135deg,#111018,#0a0a0f)}.pressgrid{display:grid;grid-template-columns:.8fr 1.2fr;gap:50px;align-items:center}.pressportrait{height:620px;border-radius:28px;background:url("assets/dj-portrait.jpg") center/cover;border:1px solid var(--line);box-shadow:var(--shadow)}
.outfits{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}.outfits img{width:100%;height:260px;object-fit:cover;border-radius:18px;border:1px solid var(--line)}
.quote{padding:25px;border-left:3px solid #ff2c9f;background:rgba(255,255,255,.035);border-radius:0 16px 16px 0;color:#ddd}
.contact{display:grid;grid-template-columns:.75fr 1.25fr;gap:25px}.box{border:1px solid var(--line);background:linear-gradient(145deg,#12121a,#0b0b10);border-radius:var(--radius);padding:30px}.form{border:1px solid var(--line);background:#0d0d13;border-radius:var(--radius);padding:30px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:13px;font-weight:850}.field input,.field textarea,.field select{width:100%;padding:13px 14px;background:#07070b;border:1px solid var(--line);border-radius:12px;color:#fff;font:inherit;outline:none}.field textarea{min-height:135px;resize:vertical}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 17px}.checks label{font-size:14px;color:#cfcfd8}.checks input{accent-color:#ff2c9f}
footer{border-top:1px solid var(--line);padding:48px 0;color:var(--muted)}.foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.foot strong{color:#fff}
.float{position:fixed;right:18px;bottom:18px;z-index:90;background:#20c96d;color:#fff;padding:13px 18px;border-radius:999px;font-weight:950;box-shadow:0 14px 40px rgba(0,0,0,.4)}
@media(max-width:900px){.navlinks{display:none}.navlinks.open{display:flex;position:absolute;top:76px;left:0;right:0;flex-direction:column;align-items:stretch;padding:18px;background:#0a0a0f;border-bottom:1px solid var(--line)}.navlinks.open a{padding:8px}.menu{display:block}.statsgrid,.grid3{grid-template-columns:1fr 1fr}.two,.pressgrid,.contact{grid-template-columns:1fr}.visual,.pressportrait{min-height:430px;height:430px}.gallery{grid-template-columns:1fr 1fr}.outfits{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.nav{height:68px}.navlinks.open{top:68px}.logo{height:43px}.hero .wrap{padding:135px 0 78px}.stats{margin-top:-20px}.statsgrid,.grid3,.grid2,.checks,.gallery,.outfits{grid-template-columns:1fr}.gallery{grid-auto-rows:230px}.gallery img:first-child{grid-row:auto}section{padding:72px 0}.sectionhead{display:block}.sectionhead p{margin-top:12px}.visual,.pressportrait{min-height:380px;height:380px}}
@media (max-width: 600px) {
  .outfits img {
    height: auto;
    object-fit: contain;
  }
}</style></head>
<body>
<header><div class="wrap nav"><a href="#home"><img class="logo" src="assets/logo-evenementertainment.jpg" alt="Evenementertainment"></a><nav class="navlinks" id="navlinks"><a href="#verhuur">Verhuur</a><a href="#dj">DJ</a><a href="#presskit">Presskit</a><a href="#galerij">Galerij</a><a class="btn primary" href="#contact">Offerte aanvragen</a></nav><button class="menu" aria-label="Menu" onclick="document.getElementById('navlinks').classList.toggle('open')">☰</button></div></header>
<main id="home">
<section class="hero"><div class="wrap"><div class="eyebrow" id="heroEyebrow"></div><h1><span id="heroTitleBefore"></span> <span id="heroTitleAccent"></span></h1><p class="lead" id="heroLead"></p><div class="actions"><a class="btn primary" id="heroPrimary" href="#contact"></a><a class="btn ghost" id="heroSecondary" href="#verhuur"></a></div></div></section>
<div class="stats"><div class="wrap statsgird statsgrid" id="stats"></div></div>
<section id="verhuur"><div class="wrap"><div class="sectionhead"><div><div class="eyebrow" id="rentalEyebrow"></div><h2 id="rentalTitle"></h2></div><p id="rentalIntro"></p></div><div class="grid3" id="rentalCards"></div></div></section>
<section id="dj" class="dark"><div class="wrap two"><div class="visual" id="djImage"></div><div><div class="eyebrow" id="djEyebrow"></div><h2 id="djTitle"></h2><p class="lead" id="djLead"></p><div class="list" id="djPoints"></div><a class="btn primary" href="#contact">DJ boeken →</a></div></div></section>
<section id="presskit" class="press"><div class="wrap pressgrid"><div class="pressportrait" id="pressPortrait"></div><div><div class="eyebrow" id="pressEyebrow"></div><h2 id="pressTitle"></h2><p class="lead" id="pressLead"></p><p id="pressText"></p><div class="quote" id="pressQuote"></div><div class="actions"><a class="btn primary" href="#contact">Boekingsaanvraag →</a><a class="btn ghost" href="#galerij">Foto's bekijken</a></div><div class="outfits" id="outfits"></div></div></div></section>
<section id="galerij"><div class="wrap"><div class="sectionhead"><div><div class="eyebrow" id="galleryEyebrow"></div><h2 id="galleryTitle"></h2></div><p id="galleryIntro"></p></div><div class="gallery" id="gallery"></div></div></section>
<section id="contact" class="dark"><div class="wrap contact"><div class="box"><div class="eyebrow" id="contactEyebrow"></div><h2 id="contactTitle"></h2><p id="contactText"></p><p><strong>Regio</strong><br><span id="contactRegion"></span></p><p><strong>Telefoon</strong><br><a id="phoneLink"></a></p><a class="btn ghost" id="whatsapp" target="_blank" rel="noopener">WhatsApp →</a></div><form class="form" onsubmit="sendMail(event)"><div class="grid2"><div class="field"><label>Naam *</label><input id="naam" required></div><div class="field"><label>E-mail *</label><input id="email" type="email" required></div><div class="field"><label>Telefoon</label><input id="telefoon" type="tel"></div><div class="field"><label>Datum</label><input id="datum" type="date"></div><div class="field"><label>Locatie</label><input id="locatie" placeholder="Plaats"></div><div class="field"><label>Type evenement</label><select id="type"><option>Maak een keuze</option><option>Verjaardag</option><option>Bruiloft</option><option>Bedrijfsfeest</option><option>Verenigingsfeest</option><option>Privéfeest</option><option>Anders</option></select></div></div><div class="field"><label>Waarvoor wil je een aanvraag?</label><div class="checks"><label><input type="checkbox" value="Licht"> Licht</label><label><input type="checkbox" value="Geluid"> Geluid</label><label><input type="checkbox" value="DJ"> Allround DJ</label><label><input type="checkbox" value="Complete productie"> Complete productie</label><label><input type="checkbox" value="Sfeer"> Sfeer / verlichting</label><label><input type="checkbox" value="Overig"> Overig</label></div></div><div class="field"><label>Bericht</label><textarea id="bericht" placeholder="Aantal gasten, tijden, locatie en wensen..."></textarea></div><button class="btn primary" type="submit">Aanvraag versturen →</button></form></div></section>
</main>
<footer><div class="wrap foot"><div><strong id="footerName">EVENEMENTERTAINMENT</strong><br>Licht • Geluid • DJ • Verhuur</div><div><span id="footerRegion"></span><br><a id="footerPhone"></a></div><div>© <span id="year"></span> <span id="footerName2">Evenementertainment</span> · <a href="/admin/">Beheer</a></div></div></footer><a class="float" id="floatWhatsapp" target="_blank" rel="noopener">WhatsApp</a>
<script>
let content={};
const $=id=>document.getElementById(id);
function setText(id,v){$(id).textContent=v||''}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(c){
 content=c; document.title=(c.siteTitle||'Evenementertainment')+' | Licht • Geluid • DJ • Verhuur'; $('metaDesc').content=c.metaDescription||'';
 setText('heroEyebrow','●  '+c.hero.eyebrow);setText('heroTitleBefore',c.hero.titleBefore);setText('heroTitleAccent',c.hero.titleAccent);setText('heroLead',c.hero.lead);setText('heroPrimary',c.hero.primaryButton);setText('heroSecondary',c.hero.secondaryButton);
 $('stats').innerHTML=(c.stats||[]).map(x=>`<div class="stat"><strong>${esc(x.title)}</strong><small>${esc(x.text)}</small></div>`).join('');
 setText('rentalEyebrow',c.rental.eyebrow);setText('rentalTitle',c.rental.title);setText('rentalIntro',c.rental.intro);$('rentalCards').innerHTML=(c.rental.cards||[]).map(x=>`<article class="card"><div class="cardimg" style="background-image:url('${esc(x.image)}')"></div><div class="cardbody"><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p><a class="more" href="#contact">Aanvragen →</a></div></article>`).join('');
 setText('djEyebrow',c.dj.eyebrow);setText('djTitle',c.dj.title);setText('djLead',c.dj.lead);$('djImage').style.backgroundImage=`url('${c.dj.image}')`;$('djPoints').innerHTML=(c.dj.points||[]).map(x=>`<div><span class="tick">✓</span><span>${esc(x)}</span></div>`).join('');
 setText('pressEyebrow',c.presskit.eyebrow);setText('pressTitle',c.presskit.title);setText('pressLead',c.presskit.lead);setText('pressText',c.presskit.text);setText('pressQuote','“'+c.presskit.quote+'”');$('pressPortrait').style.backgroundImage=`url('${c.presskit.portrait}')`;$('outfits').innerHTML=(c.presskit.outfits||[]).map(x=>`<img src="${esc(typeof x==='string'?x:x.image)}" alt="DJ studiofoto">`).join('');
 setText('galleryEyebrow',c.gallery.eyebrow);setText('galleryTitle',c.gallery.title);setText('galleryIntro',c.gallery.intro);$('gallery').innerHTML=(c.gallery.images||[]).map(x=>`<img src="${esc(typeof x==='string'?x:x.image)}" alt="Evenement en licht en geluid">`).join('');
 setText('contactEyebrow',c.contact.eyebrow);setText('contactTitle',c.contact.title);setText('contactText',c.contact.text);setText('contactRegion',c.contact.region);$('phoneLink').textContent=c.contact.phone;$('phoneLink').href='tel:'+c.contact.phone.replace(/[^0-9+]/g,'');let wa='https://wa.me/'+c.contact.phone.replace(/\D/g,'');$('whatsapp').href=wa;$('floatWhatsapp').href=wa;$('footerRegion').textContent=c.footer.region;$('footerPhone').textContent=c.footer.phone;$('footerPhone').href='tel:'+c.footer.phone.replace(/[^0-9+]/g,'');setText('footerName',c.siteTitle.toUpperCase());setText('footerName2',c.siteTitle);$('year').textContent=new Date().getFullYear();
}
fetch('content/site.json').then(r=>r.json()).then(render).catch(()=>document.body.insertAdjacentHTML('afterbegin','<div style="padding:20px;background:#600;color:#fff;text-align:center">De website-inhoud kon niet worden geladen.</div>'));
function sendMail(e){e.preventDefault();const selected=[...document.querySelectorAll('.checks input:checked')].map(x=>x.value).join(', ')||'Niet opgegeven';const body=['Naam: '+naam.value,'E-mail: '+email.value,'Telefoon: '+telefoon.value,'Datum: '+datum.value,'Locatie: '+locatie.value,'Type: '+type.value,'Wensen: '+selected,'','Bericht:',bericht.value].join('\\n');location.href='mailto:'+(content.contact?.email||'info@evenementertainment.nl')+'?subject='+encodeURIComponent('Boekings- of offerteaanvraag')+'&body='+encodeURIComponent(body)}
</script><script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</body>
</html>
